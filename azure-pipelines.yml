name: Azure ACR CI/CD

trigger:
  branches:
    include:
      - stage

jobs:
  - job: Build
    displayName: Build job
    pool:
      name: HSFAgentPool
    steps:
      - task: Docker@2
        displayName: Build and Push
        inputs:
          command: buildAndPush
          containerRegistry: HeadlessStoreFront
          repository: loyalty-api
          tags: staging
